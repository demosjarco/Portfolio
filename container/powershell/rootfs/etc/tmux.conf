# One tmux session per PowerShell window. Nobody attaches a tmux client; output leaves through `pipe-pane`, so tmux only needs to be a quiet process host.
set -g status off
set -g escape-time 0
# Matches the 3000-line screen buffer of the PowerShell shortcut.
set -g history-limit 3000
set -g default-terminal "xterm-256color"
# Sizes come from the browser window via `new-session -x/-y` and `resize-window`. Don't set `window-size manual` globally: tmux 3.4 crashes its server with it when no client is attached.
